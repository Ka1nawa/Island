name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/Island/Island.csproj
      - name: Build
        run: dotnet build src/Island/Island.csproj -c Release --no-restore
      - name: Tests
        run: dotnet run --project tests/ParserTests/ParserTests.csproj -c Release
      - name: Vulnerable packages
        run: dotnet list src/Island/Island.csproj package --vulnerable --include-transitive
